# mode defaults to client; bind-address defaults to 127.0.0.1
# mode: client
# bind-address: 127.0.0.1
log-level: info

mixed-port: 1080
# tproxy-port: 12345   # Linux/Android only

sniff: true

proxy:
  # server may be an IP or a domain (resolved via dns.default-nameserver)
  server: 1.2.3.4
  port: 4433
  sni: www.cloudflare.com
  user: spectre
  password: your-strong-password
  rx: 200mbps
  tx: 50mbps

dns:
  port: 5353
  mode: fakeip                 # redir-host | fakeip
  route-hijack: true
  # Bootstrap nameserver: resolves proxy.server domains and DoT/DoH upstream
  # domains. Must be a pure-IP udp/tcp nameserver (it cannot itself depend on
  # any resolution). Optional — falls back to direct-nameserver when that is
  # a pure-IP udp/tcp upstream.
  default-nameserver: 223.5.5.5
  # Schemes: udp (default) | tcp | tls (DoT) | https (DoH)
  #   223.5.5.5
  #   udp://1.1.1.1:53
  #   tcp://1.1.1.1:53
  #   tls://1.1.1.1:853
  #   tls://dns.google
  #   https://1.1.1.1/dns-query
  #   https://cloudflare-dns.com/dns-query
  direct-nameserver: 223.5.5.5
  proxy-nameserver: tls://1.1.1.1:853
  cache-size: 4096
  # fakeip-range / fakeip6-range default to 198.18.0.0/15 and fc00::/18
  # fakeip-range: 198.18.0.0/15
  # fakeip6-range: fc00::/18
  fakeip-filter-mode: blacklist  # blacklist | whitelist
  # fakeip-filter:
  #   - ./rules/private.ars

route:
  - direct,./rules/cn-ip.ars
  - direct,./rules/cn-domain.ars
  # block/reject: drop the connection. Domains routed here answer DNS with
  # NOERROR empty (rcode://success) — same as ant's rule-follow-route + block.
  #   - block,./rules/ads.ars
  # The final MATCH may also be block (reject everything not matched above).
  #   - block
  - proxy
