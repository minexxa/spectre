mode: client
bind-address: 127.0.0.1
log-level: info

server: 1.2.3.4:4433
server-name: www.cloudflare.com
username: spectre
password: your-strong-password
rx: 200mbps
tx: 50mbps

mixed-port: 1080
# tproxy-port: 12345   # Linux/Android only

sniff: true

dns:
  port: 5353
  rule-follow-route: true
  direct-nameserver: 223.5.5.5
  proxy-nameserver: 1.1.1.1
  cache-size: 4096

route:
  - direct,./rules/cn-ip.ars
  - direct,./rules/cn-domain.ars
  - proxy
