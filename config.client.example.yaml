# mode defaults to client; bind-address defaults to 127.0.0.1
# mode: client
# bind-address: 127.0.0.1
log-level: info

mixed-port: 1080
# tproxy-port: 12345   # Linux/Android only

sniff: true

proxy:
  server: 1.2.3.4
  port: 4433
  sni: www.cloudflare.com
  user: spectre
  password: your-strong-password
  rx: 200mbps
  tx: 50mbps

dns:
  port: 5353
  route-hijack: true
  rule-follow-route: true
  direct-nameserver: 223.5.5.5
  proxy-nameserver: 1.1.1.1
  cache-size: 4096

route:
  - direct,./rules/cn-ip.ars
  - direct,./rules/cn-domain.ars
  - proxy
