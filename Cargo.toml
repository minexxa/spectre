[package]
name = "spectre"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Spectre - A censorship-resistant QUIC proxy protocol with JLS-style camouflage and Brutal congestion control"
license = "MIT"
repository = "https://github.com/minexxa/spectre"
keywords = ["quic", "proxy", "censorship", "jls", "brutal"]
categories = ["network-programming"]
readme = "README.md"

[dependencies]
# JLS-enabled QUIC / TLS stacks
quinn-jls = { version = "0.3", default-features = false, features = ["runtime-tokio", "rustls", "ring"] }
rustls-jls = { version = "1.3", default-features = false, features = ["ring", "std", "tls12"] }

quinn-proto-jls = { version = "0.3", default-features = false }
socket2 = { version = ">=0.5, <0.7", features = ["all"] }

rcgen = "0.13"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
bytes = "1"
byteorder = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
hmac = "0.12"
rand = "0.8"
hex = "0.4"
anyhow = "1"
thiserror = "1"
dashmap = "6"

# ARS ruleset matching (domain FST + regex)
fst = "0.4"
regex = "1"
ring = "0.17"

# DoT / DoH upstream (standard rustls, independent of rustls-jls)
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "0.26"

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
libc = "0.2"
etherparse = "0.15"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
