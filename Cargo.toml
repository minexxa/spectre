[package]
name = "spectre"
version = "0.1.0"
edition = "2021"
description = "Spectre - A censorship-resistant QUIC proxy protocol with JLS-style camouflage and Brutal congestion control"
license = "MIT"
repository = "https://github.com/minexxa/spectre"
keywords = ["quic", "proxy", "censorship", "jls", "brutal"]
categories = ["network-programming"]

[dependencies]
quinn = { version = "=0.10.2", features = ["runtime-tokio", "rustls", "tls-rustls"] }
rustls = { version = "=0.21.10", features = ["dangerous_configuration"] }
rustls-pemfile = "=1.0.4"
rcgen = "=0.12.1"
tokio = { version = "=1.36.0", features = ["full"] }
bytes = "=1.5.0"
byteorder = "=1.5.0"
tracing = "=0.1.40"
tracing-subscriber = { version = "=0.3.18", features = ["env-filter"] }
serde = { version = "=1.0.197", features = ["derive"] }
serde_yaml = "=0.9.32"
clap = { version = "=4.4.18", features = ["derive"] }
sha2 = "=0.10.8"
hmac = "=0.12.1"
rand = "=0.8.5"
hex = "=0.4.3"
anyhow = "=1.0.80"
thiserror = "=1.0.57"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
