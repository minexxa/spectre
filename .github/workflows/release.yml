name: Release Build

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install cross (for aarch64)
        if: contains(matrix.target, 'aarch64')
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release
        if: ${{ !contains(matrix.target, 'aarch64') }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build release (cross)
        if: contains(matrix.target, 'aarch64')
        run: cross build --release --target ${{ matrix.target }}

      - name: Package binary
        run: |
          BIN=target/${{ matrix.target }}/release/spectre
          STAGE=spectre-${{ matrix.target }}
          mkdir -p dist/$STAGE
          cp "$BIN" dist/$STAGE/spectre
          cp README.md PROTOCOL.md dist/$STAGE/ || true
          tar -czf dist/spectre-${{ matrix.target }}.tar.gz -C dist $STAGE

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: spectre-${{ matrix.target }}
          path: dist/spectre-${{ matrix.target }}.tar.gz
          retention-days: 14

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Package
        shell: bash
        run: |
          mkdir -p dist/spectre-x86_64-pc-windows-msvc
          cp target/x86_64-pc-windows-msvc/release/spectre.exe dist/spectre-x86_64-pc-windows-msvc/
          cp README.md PROTOCOL.md dist/spectre-x86_64-pc-windows-msvc/ || true
          cd dist && 7z a spectre-x86_64-pc-windows-msvc.zip spectre-x86_64-pc-windows-msvc

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: spectre-x86_64-pc-windows-msvc
          path: dist/spectre-x86_64-pc-windows-msvc.zip
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
